name: Sync Leaderboard to Cloudflare KV

on:
  workflow_dispatch:
    # 支援透過 API（Worker /trigger-sync）以及 GitHub 網頁手動觸發

permissions:
  contents: read
  actions: write

jobs:
  sync:
    name: Sync Global Scores to Cloudflare KV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Leaderboard Sync Script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: "6e6d5e88c82f4d72a6c510818c307860"
        run: |
          node scripts/sync-leaderboard.js

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 6
